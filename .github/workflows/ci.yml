name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      # Typecheck first, and not by taste: `tsc --build` is what emits each
      # package's .d.ts, and both the type-aware lint and the tests resolve
      # @fw/* through those files. Linting first passes on a machine where a
      # previous build is still lying around, and fails on a clean checkout.
      - name: Typecheck and build
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test

  no-eval:
    name: no eval, no Math.random
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Belt and braces: the lint rules already forbid these, but a rule can be
      # disabled inline. This job cannot. See docs/adr/0002 and 0004.
      - name: Grep for forbidden constructs
        run: |
          if grep -rEn '\beval\s*\(|new Function\s*\(|\bMath\.random\s*\(' \
               --include='*.ts' --include='*.tsx' packages/; then
            echo "::error::Forbidden construct found. See docs/adr/0002 and docs/adr/0004."
            exit 1
          fi
          echo "Clean."

      # ADR 0006 promises the client cannot decide who dies: it depends on the
      # contracts and the evaluator, and on nothing that resolves a shot. A
      # promise in a document is a hope; here it is a build failure.
      - name: The client cannot reach the rules or the physics
        run: |
          if node -e "
            const pkg = require('./packages/client/package.json');
            const deps = Object.keys(pkg.dependencies ?? {});
            const forbidden = deps.filter((d) => d === '@fw/physics' || d === '@fw/rules');
            if (forbidden.length) { console.error(forbidden.join(', ')); process.exit(1); }
          "; then
            echo "Clean."
          else
            echo "::error::The client declares a package that decides outcomes. See docs/adr/0006."
            exit 1
          fi

  e2e:
    name: end to end, in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run typecheck

      - name: Install Chromium
        run: pnpm --filter @fw/client exec playwright install --with-deps chromium

      - name: Play a match in a browser
        run: pnpm --filter @fw/client run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/client/playwright-report/
          retention-days: 7
